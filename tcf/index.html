<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>STEAM Store & Suporte IA</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Motiva Sans", Arial, Helvetica, sans-serif;
      }

      body {
        background-color: #1b2838;
        color: #c6d4df;
        min-height: 100vh;
      }

      /* HEADER SUPERIOR STEAM */
      .global-header {
        background: #171a21;
        height: 104px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-bottom: 1px solid rgba(0, 0, 0, 0.2);
      }

      .header-content {
        width: 940px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .steam-logo {
        display: flex;
        align-items: center;
        gap: 12px;
        cursor: pointer;
      }

      .steam-logo-text {
        font-size: 26px;
        font-weight: 900;
        color: #ffffff;
        letter-spacing: 2px;
      }

      .global-nav {
        display: flex;
        gap: 20px;
      }

      .global-nav-btn {
        background: transparent;
        border: none;
        color: #b8b6b4;
        font-size: 14px;
        font-weight: 700;
        text-transform: uppercase;
        cursor: pointer;
        padding: 6px 0;
        letter-spacing: 1px;
        transition: color 0.2s;
      }

      .global-nav-btn:hover, .global-nav-btn.active {
        color: #1a9fff;
      }

      /* SUB-BARRA DE NAVEGAÇÃO DA LOJA */
      .store-nav-bar {
        background: linear-gradient(90deg, rgba(62,103,150,0.9) 0%, rgba(58,120,177,0.8) 100%);
        height: 35px;
        box-shadow: 0 0 3px rgba(0,0,0,0.4);
        margin-bottom: 30px;
      }

      .store-nav-content {
        width: 940px;
        margin: 0 auto;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 8px;
      }

      .cart-badge-btn {
        background: linear-gradient( to right, #47a2ff 0%, #0072ff 100%);
        color: #fff;
        border: none;
        padding: 4px 14px;
        border-radius: 2px;
        font-size: 12px;
        font-weight: bold;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .cart-badge-btn:hover {
        filter: brightness(1.1);
      }

      /* CONTAINER PRINCIPAL */
      .main-wrapper {
        width: 940px;
        margin: 0 auto;
        padding-bottom: 60px;
      }

      /* BANNER PRINCIPAL DE DESTAQUE */
      .featured-banner {
        background: #000;
        height: 350px;
        border-radius: 4px;
        overflow: hidden;
        position: relative;
        box-shadow: 0 0 10px rgba(0,0,0,0.5);
        margin-bottom: 30px;
        display: flex;
      }

      .featured-image-area {
        flex: 2;
        background-size: cover;
        background-position: center;
        position: relative;
      }

      .featured-info-area {
        flex: 1;
        background: #0f1922;
        padding: 20px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }

      /* GRID DE JOGOS DA LOJA */
      .games-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 16px;
      }

      .game-card {
        background: rgba(0, 0, 0, 0.2);
        border: 1px solid transparent;
        transition: transform 0.2s, background 0.2s;
        border-radius: 2px;
        overflow: hidden;
      }

      .game-card:hover {
        background: rgba(255, 255, 255, 0.1);
        transform: translateY(-2px);
      }

      .game-thumb {
        width: 100%;
        height: 140px;
        object-fit: cover;
      }

      .game-details {
        padding: 12px;
      }

      .game-title {
        color: #ffffff;
        font-size: 15px;
        font-weight: bold;
        margin-bottom: 8px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .price-area {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-top: 10px;
      }

      .price-tag {
        background: #000;
        padding: 4px 8px;
        color: #acdbf5;
        font-weight: bold;
        font-size: 13px;
      }

      .btn-add-cart {
        background: linear-gradient( to bottom, #799905 5%, #536904 95%);
        color: #d2efa9;
        border: none;
        padding: 6px 12px;
        font-size: 12px;
        font-weight: bold;
        border-radius: 2px;
        cursor: pointer;
      }

      .btn-add-cart:hover {
        color: #fff;
        background: linear-gradient( to bottom, #a4d007 5%, #6b8806 95%);
      }

      /* CARRINHO E CHECKOUT */
      .cart-container {
        background: rgba(0, 0, 0, 0.4);
        padding: 24px;
        border-radius: 4px;
      }

      .cart-item {
        background: rgba(0, 0, 0, 0.2);
        padding: 12px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 10px;
      }

      .cart-total-box {
        background: #101822;
        padding: 20px;
        margin-top: 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border: 1px solid #2a475e;
      }

      /* CHAT / SUPORTE IA */
      .chat-wrapper {
        display: grid;
        grid-template-columns: 240px 1fr;
        gap: 16px;
        height: 520px;
      }

      .chat-sidebar {
        background: #121c24;
        padding: 16px;
      }

      .chat-main {
        background: #121c24;
        display: flex;
        flex-direction: column;
      }

      .chat-messages-list {
        flex: 1;
        padding: 16px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .chat-input-bar {
        background: #0a0f14;
        padding: 12px;
        display: flex;
        gap: 8px;
      }

      .steam-input-field {
        flex: 1;
        background: #1b2838;
        border: 1px solid #2a475e;
        color: #fff;
        padding: 8px 12px;
        outline: none;
      }

      .steam-input-field:focus {
        border-color: #66c0f4;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/Main.tsx"></script>
  </body>
</html>
